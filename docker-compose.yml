name: owenbot

# Bot only: SQLite (./data) or an external PostgreSQL — chosen by DB_BACKEND in .env.
# Bot together with a PostgreSQL container: docker-compose.postgres.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    image: whitemanprk/owen_bot:latest
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN не задан}
      TG_PROXY: ${TG_PROXY:-}
      TG_PROXY_LOGIN: ${TG_PROXY_LOGIN:-}
      TG_PROXY_PASSWORD: ${TG_PROXY_PASSWORD:-}
      OWEN_API_URL: ${OWEN_API_URL:-https://api.owencloud.ru/v1}
      OWEN_PROXY: ${OWEN_PROXY:-}
      OWEN_PROXY_LOGIN: ${OWEN_PROXY_LOGIN:-}
      OWEN_PROXY_PASSWORD: ${OWEN_PROXY_PASSWORD:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY не задан}
      ACCESS_CODE: ${ACCESS_CODE:-}
      DB_BACKEND: ${DB_BACKEND:?DB_BACKEND не задан (sqlite или postgres)}
      SQLITE_PATH: /data/owenbot.db
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      OUTBOX_TTL_HOURS: ${OUTBOX_TTL_HOURS:-24}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-0}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_DIR: /data/backups
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /logs
      LOG_ACTIONS_UNTIL: ${LOG_ACTIONS_UNTIL:-}
    volumes:
      - ./data:/data
      # - ./logs:/logs
    # PostgreSQL on this host: POSTGRES_HOST=host.docker.internal
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    logging: *logging
